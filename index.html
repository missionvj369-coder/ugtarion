  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FCFCFC;
      background-image: radial-gradient(circle at top, #FFFFFF 0%, #F8F8F9 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    html {
      scroll-behavior: smooth;
    }
    
    /* Prevent mobile zoom on input focus */
    input, select, textarea {
      font-size: 16px !important;
    }
    
    /* Mobile layout stability */
    @media screen and (max-width: 640px) {
      input, select, textarea {
        font-size: 16px !important;
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    }
    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
    /* Accessible focus ring for keyboard users */
    :focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 2px;
    }
    @keyframes bounce-slow {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }
    .animate-bounce-slow {
      animation: bounce-slow 2s infinite;
    }

    /* Pulse Slow Animation for Human Oneness Icon */
    @keyframes pulse-slow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.85;
        transform: scale(0.97);
      }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s ease-in-out infinite;
    }
    
    /* Cosmic Drift Animation for Vision Section */
    @keyframes cosmic-drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-cosmic-drift {
      animation: cosmic-drift 45s ease infinite;
    }

    /* Footer Logo Animation */
    .ugt-logo-circle, .ugt-logo-path1, .ugt-logo-path2 {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
    }
    .ugt-logo-text {
        opacity: 0;
    }
    .logo-animate .ugt-logo-circle {
        animation: draw-path 0.5s ease-out forwards;
    }
    .logo-animate .ugt-logo-path1 {
        animation: draw-path 0.5s ease-out 0.4s forwards;
    }
    .logo-animate .ugt-logo-path2 {
        animation: draw-path 0.5s ease-out 0.8s forwards;
    }
    .logo-animate .ugt-logo-text {
        animation: fade-in-text 0.5s ease-in 1.2s forwards;
    }
    @keyframes draw-path {
        to { stroke-dashoffset: 0; }
    }
    @keyframes fade-in-text {
        to { opacity: 1; }
    }
    
    /* Tagline Animation */
    .tagline-char {
        opacity: 0;
        transform: translateY(10px);
        display: inline-block;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tagline-animate .tagline-char {
        opacity: 1;
        transform: translateY(0);
    }

    /* Word Highlight Animation */
    @keyframes highlight-glow {
      0%, 100% {
        color: inherit;
        text-shadow: none;
      }
      50% {
        color: #fff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7), 0 0 16px rgba(255, 255, 255, 0.5);
      }
    }
    .tagline-animate .highlight-word {
      animation-name: highlight-glow;
      animation-duration: 2.5s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    /* Shine effect for buttons */
    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: left 0.75s ease-in-out;
    }
    .shine-effect:hover::before {
      left: 150%;
    }

    /* Shimmer Animation for ID Card Holographic Effect */
    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(15deg); }
      100% { transform: translateX(100%) rotate(15deg); }
    }
    .animate-shimmer { animation: shimmer 3s ease-in-out infinite; }

    /* Print styles for ID Card */
    @media print {
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      @page { margin: 0; size: 3.375in 2.125in; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* Cursor Stardust Effect */
    .stardust-particle {
      position: fixed;
      z-index: 9999;
      width: 3px;
      height: 3px;
      background-color: #a5b4fc; /* Indigo-300 from Tailwind */
      border-radius: 50%;
      pointer-events: none;
      animation: fly-out 1s ease-out forwards;
      opacity: 0.7;
    }

    @keyframes fly-out {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 0.7;
      }
      to {
        transform: translate(var(--translate-x), var(--translate-y)) scale(0);
        opacity: 0;
      }
    }
    
    /* Custom Tooltip for Social Icons */
    .custom-tooltip {
      position: absolute;
      bottom: 150%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.9);
      color: #18181b; /* zinc-900 */
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      animation: tooltip-fade-in 0.3s 0.1s ease forwards;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    @keyframes tooltip-fade-in {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Email Options Dropdown Animation */
    @keyframes fade-in-scale-up {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-fade-in-scale-up {
      animation: fade-in-scale-up 0.3s ease-out forwards;
    }

    /* Print Styles - Only show ID Card */
    @media print {
      /* Hide everything by default */
      body * {
        visibility: hidden !important;
        display: none !important;
      }
      
      /* Show only the ID card when printing-id-card class is present */
      body.printing-id-card {
        visibility: visible !important;
        display: block !important;
        background: #09090b !important;
      }
      
      body.printing-id-card #root {
        visibility: visible !important;
        display: block !important;
      }
      
      /* Target the specific card by ID */
      body.printing-id-card #ugt-id-card,
      body.printing-id-card [id="ugt-id-card"] {
        visibility: visible !important;
        display: block !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        width: 340px !important;
        height: 214px !important;
        max-width: 340px !important;
        box-shadow: none !important;
        border: 1px solid #3f3f46 !important;
        background: #18181b !important;
        overflow: visible !important;
        border-radius: 16px !important;
        z-index: 999999 !important;
      }
      
      /* Ensure all nested elements in the card are visible */
      body.printing-id-card #ugt-id-card *,
      body.printing-id-card [id="ugt-id-card"] * {
        visibility: visible !important;
        display: block !important;
      }
      
      /* Hide buttons and interactive elements when printing */
      body.printing-id-card button, 
      body.printing-id-card a, 
      body.printing-id-card input, 
      body.printing-id-card .print\:hidden, 
      body.printing-id-card [aria-label*="Copy"], 
      body.printing-id-card [aria-label*="Print"] {
        display: none !important;
        visibility: hidden !important;
      }
      
      /* Print background colors */
      body.printing-id-card .bg-zinc-950 {
        background: #18181b !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      
      /* Print text colors */
      body.printing-id-card .text-amber-300, 
      body.printing-id-card .text-amber-100, 
      body.printing-id-card .text-yellow-200 {
        color: #fbbf24 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      
      body.printing-id-card .text-zinc-100, 
      body.printing-id-card .text-zinc-300 {
        color: #f4f4f5 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      
      body.printing-id-card .text-indigo-300 {
        color: #a5b4fc !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      
      /* Print background gradients */
      body.printing-id-card .bg-gradient-to-r, 
      body.printing-id-card .bg-gradient-to-br {
        background: transparent !important;
      }
      
      /* Page setup for credit card size */
      @page {
        size: 85.60mm 53.98mm;
        margin: 0;
      }
    }
  </style>
