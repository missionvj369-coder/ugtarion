  <style>
    body {

        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
    }
    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
    :focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 2px;
    }
    @keyframes bounce-slow {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    .animate-bounce-slow { animation: bounce-slow 2s infinite; }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.97); }
    }
    .animate-pulse-slow { animation: pulse-slow 3s ease-in-out infinite; }
    @keyframes cosmic-drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-cosmic-drift { animation: cosmic-drift 45s ease infinite; }
    .ugt-logo-circle, .ugt-logo-path1, .ugt-logo-path2 {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
    }
    .ugt-logo-text { opacity: 0; }
    .logo-animate .ugt-logo-circle { animation: draw-path 0.5s ease-out forwards; }
    .logo-animate .ugt-logo-path1 { animation: draw-path 0.5s ease-out 0.4s forwards; }
    .logo-animate .ugt-logo-path2 { animation: draw-path 0.5s ease-out 0.8s forwards; }
    .logo-animate .ugt-logo-text { animation: fade-in-text 0.5s ease-in 1.2s forwards; }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes fade-in-text { to { opacity: 1; } }
    .tagline-char {
        opacity: 0;
        transform: translateY(10px);
        display: inline-block;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tagline-animate .tagline-char {
        opacity: 1;
        transform: translateY(0);
    }
    @keyframes highlight-glow {
      0%, 100% { color: inherit; text-shadow: none; }
      50% { color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, 0.7), 0 0 16px rgba(255, 255, 255, 0.5); }
    }
    .tagline-animate .highlight-word {
      animation-name: highlight-glow;
      animation-duration: 2.5s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: left 0.75s ease-in-out;
    }
    .shine-effect:hover::before { left: 150%; }
    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(15deg); }
      100% { transform: translateX(100%) rotate(15deg); }
    }
    .animate-shimmer { animation: shimmer 3s ease-in-out infinite; }
    @media print {
      .print\:hidden { display: none !important; }
      .print\:block { display: block !important; }
      @page { margin: 0; size: 3.375in 2.125in; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .stardust-particle {
      position: fixed;
      z-index: 9999;
      width: 3px;
      height: 3px;
      background-color: #a5b4fc;
      border-radius: 50%;
      pointer-events: none;
      animation: fly-out 1s ease-out forwards;
      opacity: 0.7;
    }
    @keyframes fly-out {
      from { transform: translate(0, 0) scale(1); opacity: 0.7; }
      to { transform: translate(var(--translate-x), var(--translate-y)) scale(0); opacity: 0; }
    }
    .custom-tooltip {
      position: absolute;
      bottom: 150%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.9);
      color: #18181b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      animation: tooltip-fade-in 0.3s 0.1s ease forwards;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    @keyframes tooltip-fade-in {
      from { opacity: 0; transform: translateX(-50%) translateY(5px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes fade-in-scale-up {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in-scale-up { animation: fade-in-scale-up 0.3s ease-out forwards; }
    @media print {
      body * { visibility: hidden !important; display: none !important; }
      body.printing-id-card { visibility: visible !important; display: block !important; background: #09090b !important; }
      body.printing-id-card #root { visibility: visible !important; display: block !important; }

      body.printing-id-card button,
