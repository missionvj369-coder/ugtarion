# Cloudflare configuration - Worker with static assets (`wrangler deploy`).
#
# The Worker serves BOTH the built site (dist/ as static assets) AND the
# D1-backed API (/api/*, /auth/*) from one origin: ugtglobal.space.
#
# WORKERS BUILDS (dashboard connected to git) — REQUIRED SETTINGS:
#   Build command:  npm ci && npm run build
#   Deploy command: npx wrangler deploy
# Do NOT put the build inside the Deploy command. Workers Builds runs
# Build first (creates gitignored dist/), then Deploy (uploads it).
#
# NOTE: Worker names and Pages project names share one namespace. The
# deployed script is named `ugtarion` (matching the Pages project name is
# fine because the Pages project's own worker is `ugtarion-production`).

name = "ugtarion"
main = "worker/index.js"
compatibility_date = "2026-10-20"

# Route both apex and www to this Worker. DNS is already proxied (orange
# cloud) for both hostnames, so no DNS change is required.
routes = [
  { pattern = "ugtglobal.space/*", zone_name = "ugtglobal.space" },
  { pattern = "www.ugtglobal.space/*", zone_name = "ugtglobal.space" },
]

# Used by `wrangler deploy` (Worker static assets)
[assets]
directory = "dist"
binding = "ASSETS"
# Only /api/* and /auth/* must hit the Worker; all other requests are
# served straight from static assets. Without this, /api/health returns
# the SPA shell (the Pages bug we are fixing).
run_worker_first = ["/api/*", "/auth/*"]
# Serve dist/404.html for unmatched paths so deep links (/verify/:token,
# /password-reset, etc.) render the SPA shell instead of a raw 404.
# (vite.config.ts copies index.html -> 404.html on every build.)
not_found_handling = "404-page"

# Cloudflare D1 (SQLite) backing store for the UGT registry.
# Apply migrations in order:
#   npm run migrate:d1:remote
[[d1_databases]]
binding = "DB"
database_name = "ugtarion"
database_id = "3d85816d-83aa-4ebd-abee-ae4cea5e056d"
migrations_dir = "migrations"
