[build]
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "scripts/**,scripts/*"

[dev]
  command = "npm run start:api"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
