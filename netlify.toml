[build]
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "scripts/**,scripts/*"
  NODE_OPTIONS = "--max-old-space-size=4096"
  UGT_FRONTEND_URL = "https://ugtglobal.space"

[dev]
  command = "npm run start:api"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-bundled/:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

# SPA Fallback - must be last redirect
# This handles all client-side routes (password-reset, verify, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
